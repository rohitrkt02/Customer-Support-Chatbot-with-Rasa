version: "3.1"

rules:

# ── GENERAL ──────────────────────────────────────────────────
- rule: Greet user
  steps:
  - intent: greet
  - action: utter_greet

- rule: Say goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Bot challenge
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Thank you
  steps:
  - intent: thank
  - action: utter_thank

- rule: Escalate to human
  steps:
  - intent: human_agent
  - action: action_human_handoff

# ── GEMINI POWERED ────────────────────────────────────────────
# Chitchat and recommendations → Gemini generates natural replies
- rule: Handle chitchat with Gemini
  steps:
  - intent: chitchat
  - action: action_gemini_chat

- rule: Handle recommendations with Gemini
  steps:
  - intent: recommend
  - action: action_gemini_chat

# Rasa confidence < 0.4 → Gemini fallback
- rule: Gemini fallback on low confidence
  steps:
  - intent: nlu_fallback
  - action: action_gemini_fallback

# ── CAFÉ QUERIES ──────────────────────────────────────────────
- rule: Menu info
  steps:
  - intent: menu_info
  - action: action_menu_info

- rule: Ask price
  steps:
  - intent: ask_price
  - action: action_menu_info

- rule: Check item availability
  steps:
  - intent: check_availability
  - action: action_menu_info

- rule: Check time slots
  steps:
  - intent: check_slots
  - action: action_check_slots

- rule: Café general info
  steps:
  - intent: cafe_info
  - action: action_cafe_info

# ── RESERVATION FORM ─────────────────────────────────────────
- rule: Activate reservation form
  steps:
  - intent: reserve_table
  - action: reservation_form
  - active_loop: reservation_form

- rule: Submit reservation form
  condition:
  - active_loop: reservation_form
  steps:
  - action: reservation_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_reserve_table

# ── CANCEL FORM ──────────────────────────────────────────────
- rule: Activate cancel form
  steps:
  - intent: cancel_reservation
  - action: cancel_form
  - active_loop: cancel_form

- rule: Submit cancel form
  condition:
  - active_loop: cancel_form
  steps:
  - action: cancel_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_cancel_reservation