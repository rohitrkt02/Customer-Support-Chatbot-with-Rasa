version: "3.1"

# =============================================================
#  data/stories.yml — Conversation flows
# =============================================================

stories:

# ════════════════════════════════════
#  E-COMMERCE STORIES
# ════════════════════════════════════

- story: greet and goodbye
  steps:
  - intent: greet
  - action: utter_greet
  - intent: goodbye
  - action: utter_goodbye

- story: order tracking - ID provided upfront
  steps:
  - intent: greet
  - action: utter_greet
  - intent: order_status
    entities:
    - order_id: "12345"
  - action: action_check_order_status
  - intent: goodbye
  - action: utter_goodbye

- story: order tracking - no ID provided
  steps:
  - intent: order_status
  - action: utter_ask_order_id
  - intent: provide_order_id
    entities:
    - order_id: "ORD001"
  - action: action_check_order_status

- story: product info inquiry
  steps:
  - intent: product_info
    entities:
    - product_name: "iPhone 15"
  - action: action_product_info
  - intent: affirm
  - action: utter_happy

- story: ask price then get product info
  steps:
  - intent: ask_price
    entities:
    - product_name: "MacBook Air"
  - action: action_product_info
  - intent: goodbye
  - action: utter_goodbye

- story: full return request flow
  steps:
  - intent: return_request
  - action: return_form
  - active_loop: return_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_submit_return

- story: return request then thank
  steps:
  - intent: return_request
  - action: return_form
  - active_loop: return_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_submit_return
  - intent: thank
  - action: utter_thank

- story: FAQ inquiry
  steps:
  - intent: faq
  - action: utter_faq
  - intent: affirm
  - action: utter_happy

