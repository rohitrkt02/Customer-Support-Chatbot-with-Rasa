version: "3.1"

# =============================================================
#  data/nlu.yml — Aroma & Co. + Gemini AI
#  New intents: chitchat, recommend (routed to Gemini)
# =============================================================

nlu:

- intent: greet
  examples: |
    - hey
    - hello
    - hi
    - good morning
    - good evening
    - good afternoon
    - namaste
    - hiya
    - howdy

- intent: goodbye
  examples: |
    - bye
    - goodbye
    - see you later
    - take care
    - farewell
    - see ya
    - later

- intent: affirm
  examples: |
    - yes
    - yeah
    - sure
    - of course
    - absolutely
    - ok
    - okay
    - definitely
    - go ahead

- intent: deny
  examples: |
    - no
    - nope
    - not really
    - nah
    - no thanks
    - not for me

- intent: mood_great
  examples: |
    - I am feeling great
    - wonderful
    - amazing
    - fantastic
    - all good
    - excellent

- intent: mood_unhappy
  examples: |
    - I am sad
    - not good
    - feeling down
    - upset
    - frustrated
    - terrible

- intent: bot_challenge
  examples: |
    - are you a bot?
    - are you a human?
    - am I talking to a robot?
    - are you AI?
    - who are you?
    - what are you?

- intent: thank
  examples: |
    - thanks
    - thank you
    - thank you so much
    - appreciate it
    - cheers
    - many thanks

# ── CHITCHAT (routed to Gemini for natural replies) ──────────
- intent: chitchat
  examples: |
    - how are you?
    - what's up?
    - you doing good?
    - are you busy?
    - what can you do?
    - tell me a fun fact about coffee
    - what's the best coffee?
    - I love coffee
    - coffee is life
    - I'm bored
    - talk to me
    - tell me something interesting
    - do you like coffee?
    - what's your favourite drink?
    - you seem smart
    - nice chatbot
    - you're helpful
    - I really like this café

# ── RECOMMENDATIONS (routed to Gemini) ───────────────────────
- intent: recommend
  examples: |
    - what do you recommend?
    - what's your best coffee?
    - what should I try?
    - suggest something for me
    - I'm new here, what's good?
    - what's popular?
    - best item on the menu?
    - what's your bestseller?
    - I like sweet drinks, what should I get?
    - something cold please
    - I want something warm and spicy
    - give me a recommendation
    - what's the must-try here?
    - surprise me
    - best food item?
    - what pairs well with latte?

# ── TABLE RESERVATION ─────────────────────────────────────────
- intent: reserve_table
  examples: |
    - I want to book a table
    - reserve a table for [2](guest_count) on [Saturday](booking_date) at [7pm](booking_time)
    - book a table for [Rohit](customer_name) on [25 March](booking_date)
    - I'd like to make a reservation
    - can I book a table for [4 people](guest_count)?
    - table booking for [tomorrow](booking_date) at [8pm](booking_time)
    - reserve for [3](guest_count) guests
    - book a seat at the café
    - I want to dine on [Sunday](booking_date)
    - table for [2](guest_count) tonight at [8:00 PM](booking_time)
    - reservation please
    - book a table for my birthday on [22 March](booking_date)
    - I want to reserve a table for [Arjun](customer_name)
    - can you book for [Sneha](customer_name) on [Sunday](booking_date)?

- intent: check_slots
  examples: |
    - what time slots are available?
    - show me available timings
    - which slots are free on [Saturday](booking_date)?
    - is [7pm](booking_time) available on [Sunday](booking_date)?
    - available times for [tomorrow](booking_date)
    - when can I come?
    - any openings this weekend?
    - is [8 PM](booking_time) free?
    - check availability for [25 March](booking_date)
    - any table available for [tonight](booking_date)?

- intent: cancel_reservation
  examples: |
    - I want to cancel my reservation
    - cancel my booking [ARM-1234](booking_ref)
    - please cancel [ARM-5678](booking_ref)
    - I need to cancel my table
    - cancel reservation
    - I can't make it, please cancel
    - cancel my table for tomorrow

- intent: provide_booking_ref
  examples: |
    - [ARM-1234](booking_ref)
    - my reference is [ARM-5678](booking_ref)
    - it's [ARM-9012](booking_ref)
    - booking ref [ARM-7890](booking_ref)
    - reference number [ARM-0001](booking_ref)

# ── MENU INFO ─────────────────────────────────────────────────
- intent: menu_info
  examples: |
    - what's on the menu?
    - show me the menu
    - what do you serve?
    - tell me about [espresso](product_name)
    - what is [cold brew](product_name)?
    - describe [rose saffron latte](product_name)
    - do you have [matcha](product_name)?
    - tell me about [croissant](product_name)
    - what food do you serve?
    - what drinks are available?
    - do you have [vegan](product_name) options?
    - what [coffee](product_name) do you make?
    - do you have [eggs benedict](product_name)?
    - [mango lassi](product_name) details
    - tell me about [kombucha](product_name)
    - what is [blueberry lavender latte](product_name)?
    - info on [flat white](product_name)
    - tell me about [lemonade](product_name)

- intent: ask_price
  examples: |
    - how much is [espresso](product_name)?
    - price of [cold brew](product_name)
    - what does [latte](product_name) cost?
    - how expensive is [eggs benedict](product_name)?
    - cost of [croissant](product_name)
    - how much for [matcha cortado](product_name)?
    - [kombucha](product_name) price?
    - how much is [rose latte](product_name)?

- intent: check_availability
  examples: |
    - is [cold brew](product_name) available?
    - do you have [truffle toast](product_name) today?
    - is [mango lassi](product_name) on the menu?
    - [matcha](product_name) available?
    - do you have [grain bowl](product_name) today?

# ── CAFÉ INFO ─────────────────────────────────────────────────
- intent: cafe_info
  examples: |
    - what are your opening hours?
    - when do you open?
    - when do you close?
    - are you open on Sunday?
    - where are you located?
    - what's your address?
    - directions to the café
    - do you have WiFi?
    - what's the WiFi password?
    - is parking available?
    - do you have vegan options?
    - any gluten-free items?
    - what events do you have?
    - do you have live music?
    - tell me about the barista workshop
    - can I host a birthday there?
    - what payment do you accept?
    - do you accept UPI?
    - how can I contact you?
    - what's your phone number?

# ── HUMAN AGENT ───────────────────────────────────────────────
- intent: human_agent
  examples: |
    - talk to a human
    - I want to speak with someone
    - connect me to your team
    - agent please
    - I need help from a real person
    - live support
    - escalate please