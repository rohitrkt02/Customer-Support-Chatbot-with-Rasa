version: "3.1"

nlu:
- intent: greet
  examples: |
    - hey
    - hello
    - hi
    - hello there
    - good morning
    - good evening
    - hey there
    - hi there
    - greetings

- intent: goodbye
  examples: |
    - bye
    - goodbye
    - see you later
    - see you
    - talk to you later
    - bye bye
    - have a nice day
    - catch you later

- intent: order_status
  examples: |
    - where is my order
    - track my order
    - order status
    - check order status
    - what's the status of my order
    - when will my order arrive
    - I want to track my order [ORD12345](order_id)
    - status of order [ORD67890](order_id)
    - where is order number [ORD11111](order_id)

- intent: provide_order_id
  examples: |
    - [ORD12345](order_id)
    - my order id is [ORD67890](order_id)
    - [ORD99999](order_id)
    - it's [ORD54321](order_id)
    - order number [ORD88888](order_id)

- intent: product_info
  examples: |
    - tell me about [laptop](product_name)
    - information about [phone](product_name)
    - what is [headphones](product_name)
    - details of [tablet](product_name)
    - I want to know about [smartwatch](product_name)
    - product information
    - tell me about your products

- intent: return_request
  examples: |
    - I want to return my order
    - how do I return an item
    - return policy
    - I need to return something
    - can I return my purchase
    - return my order
    - I want a refund

- intent: account_info
  examples: |
    - my account information
    - update my account
    - account details
    - change my password
    - update my email
    - my profile

- intent: faq
  examples: |
    - what are your store hours
    - when are you open
    - what payment methods do you accept
    - do you accept credit cards
    - what is your return policy
    - how long for returns
    - frequently asked questions

- intent: human_agent
  examples: |
    - I want to talk to a human
    - connect me to an agent
    - speak to a representative
    - I need human help
    - transfer me to support
    - talk to a person