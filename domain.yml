version: "3.1"

# =============================================================
#  domain.yml — Aroma & Co. Café Chatbot + Gemini AI
# =============================================================

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - bot_challenge
  - thank
  - mood_great
  - mood_unhappy
  - human_agent
  - chitchat
  - recommend
  # café intents
  - reserve_table
  - check_slots
  - cancel_reservation
  - provide_booking_ref
  - menu_info
  - ask_price
  - check_availability
  - cafe_info

entities:
  - product_name
  - booking_date
  - booking_time
  - guest_count
  - customer_name
  - booking_ref

slots:
  product_name:
    type: text
    mappings:
    - type: from_entity
      entity: product_name

  customer_name:
    type: text
    mappings:
    - type: from_entity
      entity: customer_name
    - type: from_text
      conditions:
      - active_loop: reservation_form
        requested_slot: customer_name

  booking_date:
    type: text
    mappings:
    - type: from_entity
      entity: booking_date
    - type: from_text
      conditions:
      - active_loop: reservation_form
        requested_slot: booking_date

  booking_time:
    type: text
    mappings:
    - type: from_entity
      entity: booking_time
    - type: from_text
      conditions:
      - active_loop: reservation_form
        requested_slot: booking_time

  guest_count:
    type: text
    mappings:
    - type: from_entity
      entity: guest_count
    - type: from_text
      conditions:
      - active_loop: reservation_form
        requested_slot: guest_count

  booking_ref:
    type: text
    mappings:
    - type: from_entity
      entity: booking_ref
    - type: from_text
      conditions:
      - active_loop: cancel_form
        requested_slot: booking_ref

responses:

  utter_greet:
  - text: "Hello! ☕ Welcome to Aroma & Co. How can I help you today?"
  - text: "Hi there! 😊 I can help with table bookings, menu, hours, events & more!"
  - text: "Hey! Welcome to Aroma & Co. — Lucknow's favourite artisan café. What can I do for you?"

  utter_goodbye:
  - text: "Thank you for visiting Aroma & Co.! See you soon. ☕🌟"
  - text: "Goodbye! We hope to see you at our café. Have a wonderful day! 👋"

  utter_happy:
  - text: "Great! Glad I could help. 😊 Anything else?"
  - text: "Wonderful! Let me know if you need anything else. ✨"

  utter_cheer_up:
  - text: "A good cup of coffee fixes everything! ☕ Come visit us at Aroma & Co."

  utter_did_that_help:
  - text: "Did that help? Let me know if you need anything else! 💡"

  utter_iamabot:
  - text: "I'm the Aroma & Co. virtual assistant, powered by Rasa + Gemini AI! 🤖☕ I'm here 24/7."

  utter_thank:
  - text: "You're very welcome! Happy to help. 😊"
  - text: "My pleasure — that's what I'm here for! 🌟"

  utter_ask_customer_name:
  - text: "What name should I put the reservation under?"

  utter_ask_booking_date:
  - text: "What date would you like to visit? (e.g. 'tomorrow' or '25 March')"

  utter_ask_booking_time:
  - text: "What time works best?\n🕗 8:00 AM | 9:30 AM | 11:00 AM | 12:30 PM\n🕔 2:00 PM | 3:30 PM | 5:00 PM | 6:30 PM | 8:00 PM"

  utter_ask_guest_count:
  - text: "How many guests will be joining you?"

  utter_ask_booking_ref:
  - text: "Please share your booking reference number (e.g. ARM-1234)."

  utter_default:
  - text: "Let me think about that... 🤔"

actions:
  - action_reserve_table
  - action_check_slots
  - action_cancel_reservation
  - action_menu_info
  - action_cafe_info
  - action_human_handoff
  - action_gemini_fallback
  - action_gemini_chat
  - validate_reservation_form

forms:
  reservation_form:
    required_slots:
      - customer_name
      - booking_date
      - booking_time
      - guest_count

  cancel_form:
    required_slots:
      - booking_ref

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true